name : Github Actions Demo for this Repo
run-name : ${{ github.actor }} is testing out github actions 
on : [push]
jobs:
  Explore-Github-Actions:
    runs-on: ubuntu-latest 
    steps:
      - run: echo "The job was automatically trigger by a ${{ github.event_name}} event"
      - run: echo "The job is now running on a ${{ runner.os }} server hosted on Github!" 
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}"
      - name: check out repository code 
      - uses: actions/checkout@v4 
      - run: echo "The ${{ github.repository }} has been cloned to the runner. "
      - run: echo "The workflow is now ready to test your workflow on the runner"
      - name : List Files in the Runner 
      - run: | 
        ls ${{ github.workspace }}
      - run: echo "The job's  status is ${{ job.status }}"
